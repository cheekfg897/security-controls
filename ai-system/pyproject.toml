[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sct-comparison"
version = "0.1.0"
description = "Evidence-first comparison engine and web application for SCT result packages"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
]
ai = [
    "langchain-core==1.4.9",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.3.5",
    "pydantic==2.12.5",
]
all = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
    "langchain-core==1.4.9",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.3.5",
    "pydantic==2.12.5",
]

[project.scripts]
sct-compare = "sct_ai.cli:main"
sct-compare-web = "sct_ai.web:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sct_ai = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.txt",
    "skills/*/*.json",
    "skills/*/*.md",
]
